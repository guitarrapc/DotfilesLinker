name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@main
      - name: Restore dependencies
        shell: bash
        run: dotnet restore
      - name: Build
        shell: bash
        run: dotnet build -c Release --no-restore
      - name: Test
        shell: bash
        run: dotnet test -c Release --no-build --logger GitHubActions --logger "console;verbosity=normal"
      # output to ./src/DotfilesLinker/artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}/*
      - name: Publish
        shell: bash
        run: dotnet publish -c Release -r ${{ matrix.rid }} --artifacts-path ./artifacts
        working-directory: ./src/DotfilesLinker
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.rid }}
          path: ./src/DotfilesLinker/artifacts/publish/DotfilesLinker/**
          retention-days: 1
          if-no-files-found: error
      - name: Execute published binary without runtime
        shell: bash
        run: |
          chmod +x ./artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}/DotfilesLinker || true
          ./artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}/DotfilesLinker --version
          ./artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}/DotfilesLinker --help

  # marker job to target PR status check
  build-complete:
    needs: [build]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: result
        run: exit 0
