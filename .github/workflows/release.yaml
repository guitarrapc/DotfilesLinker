name: Release
on:
  push:
    tags:
      - "v*.*.*" # v1.2.3

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify version ↔ tag consistency
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' is not a semantic version tag (vX.Y.Z)."
            exit 1
          fi

          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          TAG_VERSION="${TAG#v}"
          if [ "${PROPS_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version mismatch: Directory.Build.props has '${PROPS_VERSION}' but tag is '${TAG}' (expected '${TAG_VERSION}')."
            exit 1
          fi

          echo "version=${PROPS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Version check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${PROPS_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    strategy:
      # see: https://docs.github.com/ja/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            archive_name: DotfilesLinker_win_amd64.zip
          - os: windows-11-arm
            rid: win-arm64
            archive_name: DotfilesLinker_win_arm64.zip
          - os: ubuntu-24.04
            rid: linux-x64
            archive_name: DotfilesLinker_linux_amd64.tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive_name: DotfilesLinker_linux_arm64.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            archive_name: DotfilesLinker_darwin_amd64.tar.gz
          - os: macos-26
            rid: osx-arm64
            archive_name: DotfilesLinker_darwin_arm64.tar.gz
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: dotnet publish (Native AOT)
        shell: bash
        run: dotnet publish -c Release ./src/DotfilesLinker/ -r ${{ matrix.rid }} -p:Version="${VERSION}" -r ${{ matrix.rid }} --artifacts-path ./artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
      - name: Remove debug symbols
        shell: bash
        run: |
          # Remove PDB files (Windows)
          find ./artifacts -name "*.pdb" -type f -delete
          # Remove dSYM directories (macOS)
          find ./artifacts -name "*.dSYM" -type d -exec rm -rf {} +
          # Remove debug symbol files that might be present on Linux
          find ./artifacts -name "*.dbg" -type f -delete

          echo "Removed debug symbols files"
      - name: Generate SPDX SBOM
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish_dir="./src/DotfilesLinker/artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}"
          sbom_dir="${RUNNER_TEMP}/dotfileslinker-sbom-${{ matrix.rid }}"
          validation_output="${RUNNER_TEMP}/dotfileslinker-sbom-validation-${{ matrix.rid }}.json"

          dotnet tool run sbom-tool generate \
            -b "${publish_dir}" \
            -bc ./src/DotfilesLinker \
            -pn DotfilesLinker \
            -pv "${TAG}" \
            -ps guitarrapc \
            -nsb https://github.com/guitarrapc/DotfilesLinker \
            -m "${sbom_dir}" \
            -mi SPDX:2.2 \
            -D true

          dotnet tool run sbom-tool validate \
            -b "${publish_dir}" \
            -m "${sbom_dir}/_manifest" \
            -o "${validation_output}" \
            -mi SPDX:2.2 \
            -n

          cp "${sbom_dir}/_manifest/spdx_2.2/manifest.spdx.json" "${{ matrix.archive_name }}.spdx.json"
          test -s "${{ matrix.archive_name }}.spdx.json"
      - name: Create archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Compress-Archive -Path ./src/DotfilesLinker/artifacts/publish/DotfilesLinker/release_${{ matrix.rid }}/* -DestinationPath ${{ matrix.archive_name }}
      - name: Create archive (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: tar -czvf ${{ matrix.archive_name }} -C ./src/DotfilesLinker/artifacts/publish/DotfilesLinker/release_${{ matrix.rid }} .
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive_name }}
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.archive_name }}
          sbom-path: ${{ matrix.archive_name }}.spdx.json
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.spdx.json
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [validate, publish]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
          merge-multiple: true
      - name: List artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f | sort

          # Ensure we have artifacts to release
          if [ -z "$(find ./artifacts -type f)" ]; then
            echo "::error::No artifacts found. Aborting release creation."
            exit 1
          fi
      # Generate SHA256 checksums for all artifacts
      - name: Generate checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Create checksums file
          CHECKSUM_FILE="./DotfilesLinker_${TAG}_checksums.txt"

          # Calculate SHA256 checksums
          cd ./artifacts
          sha256sum ./* > "${CHECKSUM_FILE}"
          cat "${CHECKSUM_FILE}"
          cd ..

      - name: Create GitHub Release via gh
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: gh release create "$TAG" --title "v$VERSION" --generate-notes --fail-on-no-commits --draft ./artifacts/*
